<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Espace administrateur')}"></head>
<body>
<header th:replace="~{fragments :: barre}"></header>

<main class="conteneur">
    <div class="carte">
        <span class="badge badge-admin">Zone sensible</span>
        <h1 style="margin-top:14px">Espace Administrateur</h1>
        <p class="intro">
            Section reservee au role <code>ADMIN</code>. La liste ci-dessous est lue
            directement dans la base via <code>UserRepository.findAll()</code>.
        </p>

        <table class="comptes">
            <thead>
            <tr><th>Id</th><th>Nom d'utilisateur</th><th>Actif</th><th>Roles</th></tr>
            </thead>
            <tbody>
            <tr th:each="compte : ${comptes}">
                <td th:text="${compte.id}">1</td>
                <td th:text="${compte.username}">user</td>
                <td th:text="${compte.active} ? 'oui' : 'non'">oui</td>
                <td th:text="${#strings.listJoin(compte.roles.![name], ', ')}">ROLE_USER</td>
            </tr>
            </tbody>
        </table>

        <p style="margin-top:22px"><a th:href="@{/home}">Retour a l'accueil</a></p>
    </div>
    <p class="pied">TP 11 &mdash; Authentification JDBC / JPA avec Spring Security</p>
</main>
</body>
</html>
